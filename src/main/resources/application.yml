server:
  port: 8080
  tomcat:
    max-http-form-post-size: 10MB

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/exam_system?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:20030506}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ExamSystemSecretKey2024VeryLongStringForHS256Algorithm
  expiration: 86400000

# AI配置 (小米MiMo API)
# 文档：https://api.xiaomimimo.com
ai:
  siliconflow:
    api-key: ${AI_API_KEY:sk-cgba2311sri6rzkcc8vug21gs5jrtkmf476wdjirc0c9n619}
    base-url: https://api.xiaomimimo.com/v1
    model: mimo-v2.5-pro
    max-tokens: 10000
    temperature: 1.0
